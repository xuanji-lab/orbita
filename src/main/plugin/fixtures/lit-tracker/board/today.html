<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%}
body{font:14px/1.5 var(--font-family-base,system-ui);background:#f6efe4;color:#2b2118;display:flex;flex-direction:column;justify-content:space-between;padding:14px 16px;box-sizing:border-box;border-left:6px solid #c8553d}
.lab{font-size:11px;letter-spacing:.08em;color:#8a6b52}
h1{margin:4px 0 0;font:600 17px/1.3 Georgia,"Songti SC",serif}
p{margin:6px 0 0;color:#5b4636;font-size:12px}
.acts{display:flex;gap:8px}
button{font:inherit;font-size:12px;border:1px solid #c8553d;background:transparent;color:#c8553d;border-radius:99px;padding:3px 12px;cursor:pointer}
button.on{background:#c8553d;color:#fff}
.empty{color:#8a6b52}
</style></head><body>
<div id="root"><div class="empty">还没有产出</div></div>
<script>
var card=null;
function paint(m){
  var d=m.data; card=m.card;
  var r=document.getElementById("root");
  if(!d){r.innerHTML='<div class="empty">还没有产出</div>';return}
  r.innerHTML='<div class="lab">今日一篇 · '+d.date+' · '+d.venue+'</div><h1></h1><p></p>';
  r.querySelector("h1").textContent=d.title; r.querySelector("p").textContent=d.why;
  var a=document.createElement("div");a.className="acts";
  [["相关","useful"],["不相关","irrelevant"]].forEach(function(x){var b=document.createElement("button");b.textContent=x[0];b.onclick=function(){parent.postMessage({type:"orbita:action",action:"feedback",payload:{verdict:x[1],title:d.title}},"*")};a.appendChild(b)});
  r.appendChild(a);
  var f=Math.max(11,Math.min(17,m.unit.width/18));document.querySelector("h1").style.fontSize=f+"px";
}
addEventListener("message",function(e){if(e.data&&e.data.type==="orbita:data")paint(e.data)});
parent.postMessage({type:"orbita:ready"},"*");
</script></body></html>
