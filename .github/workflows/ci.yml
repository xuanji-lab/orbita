# 跨平台测试门禁：本仓的测试用 node --test 跑（不依赖 Electron、不需要显示器），
# 托管 runner 直接跑得动。没有 CI 时「本机绿」只对写代码那台机器成立——
# #108 的 4 条 POSIX 硬编码测试在 main 上红了一周没人发现，就是这条教训。
#
# 平台分工：windows 每次全跑（PR + push）；macos 只在 push main 跑——
# 平台差异是成对的（在 mac 上写、在 Windows 坏，反过来也存在），但 PR 阶段
# 双倍分钟数不便宜（私有仓 Windows runner 按 2 倍计费），push main 兜底。
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6 # 与 package.json 的 packageManager 一致
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # 测试用 node --test + 类型剥离 + node:sqlite，与本机一致
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  test-macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
