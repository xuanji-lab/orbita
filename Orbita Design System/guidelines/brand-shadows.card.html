<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--color-bg-app);font-family:var(--font-family-base);color:var(--color-text-primary)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;min-width:112px}.chip{height:44px;border-radius:var(--radius-md);border:1px solid var(--color-border-subtle)}.n{font-family:var(--font-family-business);font-size:11px;color:var(--color-text-secondary)}.v{font-family:var(--font-family-business);font-size:10px;color:var(--color-text-tertiary)}</style></head><body><div class="row">
<div class="sw" style="min-width:140px"><div style="height:48px;border-radius:var(--radius-lg);background:var(--color-bg-panel);box-shadow:var(--shadow-border)"></div><span class="n">--shadow-border</span><span class="v">hairline</span></div><div class="sw" style="min-width:140px"><div style="height:48px;border-radius:var(--radius-lg);background:var(--color-bg-panel);box-shadow:var(--shadow-composer)"></div><span class="n">--shadow-composer</span><span class="v">cards & input</span></div><div class="sw" style="min-width:140px"><div style="height:48px;border-radius:var(--radius-lg);background:var(--color-bg-panel);box-shadow:var(--shadow-popover)"></div><span class="n">--shadow-popover</span><span class="v">menus</span></div><div class="sw" style="min-width:140px"><div style="height:48px;border-radius:var(--radius-lg);background:var(--color-bg-panel);box-shadow:var(--shadow-modal)"></div><span class="n">--shadow-modal</span><span class="v">dialogs</span></div>
<div class="sw" style="min-width:140px"><div style="height:48px;border-radius:var(--radius-md);background:var(--color-bg-panel);border:1px solid var(--color-accent);box-shadow:var(--focus-ring)"></div><span class="n">--focus-ring</span><span class="v">2px accent 16% (blue / yellow)</span></div>
</div></body></html>
