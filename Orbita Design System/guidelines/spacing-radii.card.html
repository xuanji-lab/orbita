<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--color-bg-app);font-family:var(--font-family-base);color:var(--color-text-primary)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;min-width:112px}.chip{height:44px;border-radius:var(--radius-md);border:1px solid var(--color-border-subtle)}.n{font-family:var(--font-family-business);font-size:11px;color:var(--color-text-secondary)}.v{font-family:var(--font-family-business);font-size:10px;color:var(--color-text-tertiary)}</style></head><body><div class="row">
<div class="sw" style="min-width:92px"><div style="height:44px;background:var(--color-bg-panel);border:1px solid var(--color-border-strong);border-radius:var(--radius-xs)"></div><span class="n">--radius-xs</span><span class="v">4px</span></div><div class="sw" style="min-width:92px"><div style="height:44px;background:var(--color-bg-panel);border:1px solid var(--color-border-strong);border-radius:var(--radius-sm)"></div><span class="n">--radius-sm</span><span class="v">6px</span></div><div class="sw" style="min-width:92px"><div style="height:44px;background:var(--color-bg-panel);border:1px solid var(--color-border-strong);border-radius:var(--radius-md)"></div><span class="n">--radius-md</span><span class="v">6px</span></div><div class="sw" style="min-width:92px"><div style="height:44px;background:var(--color-bg-panel);border:1px solid var(--color-border-strong);border-radius:var(--radius-lg)"></div><span class="n">--radius-lg</span><span class="v">8px</span></div><div class="sw" style="min-width:92px"><div style="height:44px;background:var(--color-bg-panel);border:1px solid var(--color-border-strong);border-radius:var(--radius-xl)"></div><span class="n">--radius-xl</span><span class="v">10px</span></div><div class="sw" style="min-width:92px"><div style="height:44px;background:var(--color-bg-panel);border:1px solid var(--color-border-strong);border-radius:var(--radius-composer)"></div><span class="n">--radius-composer</span><span class="v">14px</span></div>
<div class="sw" style="min-width:92px"><div style="height:44px;width:44px;background:var(--color-accent);border-radius:var(--radius-pill)"></div><span class="n">--radius-pill</span><span class="v">circles only</span></div>
</div></body></html>
