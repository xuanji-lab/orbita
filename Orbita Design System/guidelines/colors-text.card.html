<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--color-bg-app);font-family:var(--font-family-base);color:var(--color-text-primary)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;min-width:112px}.chip{height:44px;border-radius:var(--radius-md);border:1px solid var(--color-border-subtle)}.n{font-family:var(--font-family-business);font-size:11px;color:var(--color-text-secondary)}.v{font-family:var(--font-family-business);font-size:10px;color:var(--color-text-tertiary)}</style></head><body><div class="row" style="align-items:flex-end">
<div class="sw" style="min-width:150px"><span style="font-size:19px;color:var(--color-text-primary)">Aa primary</span><span class="n">--color-text-primary</span><span class="v">#202124</span></div>
<div class="sw" style="min-width:150px"><span style="font-size:19px;color:var(--color-text-secondary)">Aa secondary</span><span class="n">--color-text-secondary</span><span class="v">#5f6368</span></div>
<div class="sw" style="min-width:150px"><span style="font-size:19px;color:var(--color-text-tertiary)">Aa tertiary</span><span class="n">--color-text-tertiary</span><span class="v">#8b8f94</span></div>
<div class="sw" style="min-width:150px"><span style="font-size:19px;color:var(--color-text-inverse);background:var(--color-text-primary);padding:0 6px;border-radius:4px">Aa inverse</span><span class="n">--color-text-inverse</span><span class="v">#ffffff</span></div>
</div></body></html>
