<!-- @dsCard group="Colors" viewport="700x150" name="Borders" subtitle="Three hairline weights, no heavy rules" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--color-bg-app);font-family:var(--font-family-base);color:var(--color-text-primary)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;min-width:112px}.chip{height:44px;border-radius:var(--radius-md);border:1px solid var(--color-border-subtle)}.n{font-family:var(--font-family-business);font-size:11px;color:var(--color-text-secondary)}.v{font-family:var(--font-family-business);font-size:10px;color:var(--color-text-tertiary)}</style></head><body><div class="row">
<div class="sw" style="min-width:180px"><div class="chip" style="background:var(--color-bg-panel);border-color:var(--color-border-subtle)"></div><span class="n">--color-border-subtle</span><span class="v">#e5e5df · default hairline</span></div>
<div class="sw" style="min-width:180px"><div class="chip" style="background:var(--color-bg-panel);border-color:var(--color-border-default)"></div><span class="n">--color-border-default</span><span class="v">#dfdfd7 · inputs</span></div>
<div class="sw" style="min-width:180px"><div class="chip" style="background:var(--color-bg-panel);border-color:var(--color-border-strong)"></div><span class="n">--color-border-strong</span><span class="v">#d7d7cf · hover / handles</span></div>
</div></body></html>
