<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--color-bg-app);font-family:var(--font-family-base);color:var(--color-text-primary)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;min-width:112px}.chip{height:44px;border-radius:var(--radius-md);border:1px solid var(--color-border-subtle)}.n{font-family:var(--font-family-business);font-size:11px;color:var(--color-text-secondary)}.v{font-family:var(--font-family-business);font-size:10px;color:var(--color-text-tertiary)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--color-bg-app)"></div><span class="n">--color-bg-app</span><span class="v">#f3f4f1</span></div><div class="sw"><div class="chip" style="background:var(--color-bg-sidebar)"></div><span class="n">--color-bg-sidebar</span><span class="v">#f7f7f3</span></div><div class="sw"><div class="chip" style="background:var(--color-bg-panel)"></div><span class="n">--color-bg-panel</span><span class="v">#ffffff</span></div><div class="sw"><div class="chip" style="background:var(--color-bg-muted)"></div><span class="n">--color-bg-muted</span><span class="v">#f8f8f5</span></div><div class="sw"><div class="chip" style="background:var(--color-bg-hover)"></div><span class="n">--color-bg-hover</span><span class="v">#f0f1ed</span></div><div class="sw"><div class="chip" style="background:var(--color-bg-active)"></div><span class="n">--color-bg-active</span><span class="v">#e9f6ed</span></div></div></body></html>
