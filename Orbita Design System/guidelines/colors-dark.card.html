<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--color-bg-app);font-family:var(--font-family-base);color:var(--color-text-primary)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;min-width:112px}.chip{height:44px;border-radius:var(--radius-md);border:1px solid var(--color-border-subtle)}.n{font-family:var(--font-family-business);font-size:11px;color:var(--color-text-secondary)}.v{font-family:var(--font-family-business);font-size:10px;color:var(--color-text-tertiary)}</style></head><body><div class="row" style="padding:12px;background:#111315;border-radius:var(--radius-md)">
<div class="sw"><div class="chip" style="background:#111315;border-color:#2a2f35"></div><span class="n" style="color:#b9c0c8">--color-bg-app</span><span class="v" style="color:#858e99">#111315</span></div>
<div class="sw"><div class="chip" style="background:#171a1d;border-color:#2a2f35"></div><span class="n" style="color:#b9c0c8">--color-bg-sidebar</span><span class="v" style="color:#858e99">#171a1d</span></div>
<div class="sw"><div class="chip" style="background:#1d2024;border-color:#2a2f35"></div><span class="n" style="color:#b9c0c8">--color-bg-panel</span><span class="v" style="color:#858e99">#1d2024</span></div>
<div class="sw"><div class="chip" style="background:#252a2f;border-color:#2a2f35"></div><span class="n" style="color:#b9c0c8">--color-bg-hover</span><span class="v" style="color:#858e99">#252a2f</span></div>
<div class="sw"><div class="chip" style="background:#e3c25a;border-color:transparent"></div><span class="n" style="color:#b9c0c8">--color-accent</span><span class="v" style="color:#858e99">#e3c25a</span></div>
<div class="sw"><div class="chip" style="background:rgba(29,32,36,.5);border-color:rgba(255,255,255,.08)"></div><span class="n" style="color:#b9c0c8">--glass-bg</span><span class="v" style="color:#858e99">rgba(29,32,36,.5)</span></div>
</div></body></html>
