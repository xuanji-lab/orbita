<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--color-bg-app);font-family:var(--font-family-base);color:var(--color-text-primary)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;min-width:112px}.chip{height:44px;border-radius:var(--radius-md);border:1px solid var(--color-border-subtle)}.n{font-family:var(--font-family-business);font-size:11px;color:var(--color-text-secondary)}.v{font-family:var(--font-family-business);font-size:10px;color:var(--color-text-tertiary)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--color-danger)"></div><span class="n">--color-danger</span><span class="v">#b42318</span></div><div class="sw"><div class="chip" style="background:var(--color-danger-soft)"></div><span class="n">--color-danger-soft</span><span class="v">#fdecea</span></div><div class="sw"><div class="chip" style="background:var(--color-warning)"></div><span class="n">--color-warning</span><span class="v">#b7791f · running</span></div><div class="sw"><div class="chip" style="background:var(--color-info)"></div><span class="n">--color-info</span><span class="v">#2563eb · thinking</span></div></div></body></html>
