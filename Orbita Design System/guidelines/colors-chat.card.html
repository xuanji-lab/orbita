<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--color-bg-app);font-family:var(--font-family-base);color:var(--color-text-primary)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;min-width:112px}.chip{height:44px;border-radius:var(--radius-md);border:1px solid var(--color-border-subtle)}.n{font-family:var(--font-family-business);font-size:11px;color:var(--color-text-secondary)}.v{font-family:var(--font-family-business);font-size:10px;color:var(--color-text-tertiary)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--color-chat-card-bg)"></div><span class="n">--color-chat-card-bg</span><span class="v">#fafafa · user bubble</span></div><div class="sw"><div class="chip" style="background:var(--color-chat-muted-bg)"></div><span class="n">--color-chat-muted-bg</span><span class="v">#f4f4f5</span></div><div class="sw"><div class="chip" style="background:var(--color-chat-link)"></div><span class="n">--color-chat-link</span><span class="v">#2762ea</span></div><div class="sw"><div class="chip" style="background:var(--color-code-bg)"></div><span class="n">--color-code-bg</span><span class="v">#111418</span></div><div class="sw"><div class="chip" style="background:var(--color-code-text)"></div><span class="n">--color-code-text</span><span class="v">#d1d5db</span></div></div></body></html>
