<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><title>Orbita — Agent workspace</title>
<link rel="stylesheet" href="../../styles.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--font-family-base);color:var(--color-text-primary);background:var(--color-bg-app)}
#root{height:100vh}
/* wallpaper is independent of theme — any of the four pairings is valid */
.desk{height:100%;padding:14px;background:radial-gradient(1100px 620px at 22% 8%, #ffffff 0%, rgba(255,255,255,0) 58%), linear-gradient(140deg,#e8ebe4 0%,#f3f4f1 42%,#eae7dd 100%)}
.desk.wall-dark{background:radial-gradient(1100px 620px at 22% 8%, #3a4a42 0%, rgba(58,74,66,0) 58%), linear-gradient(140deg,#26332e 0%,#1b2024 42%,#332c22 100%)}
.probe{position:fixed;z-index:60;right:18px;bottom:18px;display:flex;gap:6px;padding:5px;border-radius:var(--radius-pill);background:var(--glass-bg);border:1px solid var(--glass-border);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));box-shadow:var(--shadow-composer)}
.probe button{font-family:var(--font-family-business);font-size:11px;height:26px;padding:0 11px;border-radius:var(--radius-pill);border:1px solid transparent;background:transparent;color:var(--color-text-secondary);cursor:pointer}
.probe button[aria-pressed="true"]{background:var(--color-accent);border-color:transparent;color:var(--color-accent-fg)}
.hairline{border-bottom:1px solid var(--color-border-subtle)}
.scroll{overflow-y:auto;scrollbar-width:thin}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-thumb{background:var(--color-border-strong);border-radius:999px}
.fade-out{opacity:0;transform:translateY(-14px);transition:var(--transition-layer)}
.slide-down{transform:translateY(42vh) scale(.97);opacity:0;transition:var(--transition-composer-exit)}
@keyframes orbita-spin{to{transform:rotate(360deg)}}
@keyframes orbita-skeleton{0%,100%{opacity:1}50%{opacity:.45}}
a{color:var(--color-chat-link);text-decoration:none}
a:hover{color:var(--color-accent-strong)}
</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.ORBITA_ICON_BASE="../../assets/icons/lucide";</script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="data.js"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="ChatScreen.jsx"></script>
<script type="text/babel" src="Drawer.jsx"></script>
<script type="text/babel" src="SettingsDialog.jsx"></script>
<script type="text/babel" src="App.jsx"></script>
</body></html>
