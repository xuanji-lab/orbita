<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Orbita app shell" description="Layer 1 boundary, unbounded sidebar, floating content pane, action rail" -->
<helmet>
<script>window.ORBITA_ICON_BASE="../../assets/icons/lucide"</script>
<script src="./ds-base.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}</style>
</helmet>
<div style="height:100vh;padding:14px;font-family:var(--font-family-base);color:var(--color-text-primary);background:radial-gradient(1100px 620px at 22% 8%, #ffffff 0%, rgba(255,255,255,0) 58%), linear-gradient(140deg,#e8ebe4 0%,#f3f4f1 42%,#eae7dd 100%)">
<div style="height:100%;display:flex;gap:var(--space-3);padding:var(--space-3);background:var(--glass-bg);border:0;border-radius:var(--radius-xl);box-shadow:var(--shadow-composer);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));overflow:hidden">
<aside style="width:288px;flex:0 0 288px;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-2) var(--space-3);background:transparent;overflow:hidden">
<div style="display:flex;align-items:center;gap:10px">
<x-import component-from-global-scope="OrbitaDesignSystem_994749.IconButton" label="Collapse sidebar" hint-size="32px,32px"><x-import component-from-global-scope="OrbitaDesignSystem_994749.Icon" name="panel-left" size="{{ 14 }}" hint-size="14px,14px"></x-import></x-import>
<x-import component-from-global-scope="OrbitaDesignSystem_994749.BrandLockup" hint-size="90px,34px"></x-import>
</div>
<div style="display:flex;gap:4px" role="tablist">
<x-import component-from-global-scope="OrbitaDesignSystem_994749.ModeChip" active="{{ true }}" hint-size="50%,26px">Agent mode</x-import>
<x-import component-from-global-scope="OrbitaDesignSystem_994749.ModeChip" disabled="{{ true }}" hint-size="50%,26px">Orchestrate</x-import>
</div>
<button type="button" style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:32px;padding:0 10px;border:0;border-radius:var(--radius-md);background:var(--color-accent);color:var(--color-accent-fg);font-family:var(--font-family-base);font-size:var(--font-size-control);font-weight:var(--weight-medium);cursor:pointer">New task</button>
<div style="display:flex;align-items:center;gap:6px;height:32px;padding:0 10px">
<span style="display:inline-flex;color:var(--color-text-tertiary)"><x-import component-from-global-scope="OrbitaDesignSystem_994749.Icon" name="search" size="{{ 14 }}" hint-size="14px,14px"></x-import></span>
<span style="font-size:var(--font-size-control);color:var(--color-text-tertiary)">Search</span>
</div>
<div style="flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;margin-right:calc(-1 * var(--space-3));padding-right:var(--space-3)">
<div style="display:grid;grid-template-columns:minmax(0,1fr) 32px;align-items:center;gap:2px;min-height:28px">
<span style="font-family:var(--font-family-business);font-size:var(--font-size-micro);letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-secondary)">Workspaces</span>
<x-import component-from-global-scope="OrbitaDesignSystem_994749.IconButton" label="New workspace" hint-size="32px,32px"><x-import component-from-global-scope="OrbitaDesignSystem_994749.Icon" name="folder-plus" size="{{ 14 }}" hint-size="14px,14px"></x-import></x-import>
</div>
<div style="padding:var(--space-2) 0">
<div style="display:grid;grid-template-columns:minmax(0,1fr) 32px;align-items:center;gap:2px">
<span style="display:grid;grid-template-columns:24px minmax(0,1fr) max-content;align-items:center;gap:var(--space-2);min-height:28px">
<span style="display:grid;place-items:center;width:24px;height:24px;color:var(--color-text-secondary)"><x-import component-from-global-scope="OrbitaDesignSystem_994749.Icon" name="folder" size="{{ 14 }}" stroke-width="{{ 1.8 }}" hint-size="14px,14px"></x-import></span>
<span style="min-width:0;display:flex;align-items:center;gap:6px">
<strong style="font-size:var(--font-size-control);font-weight:var(--weight-semibold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">workspace-name</strong>
<span style="display:inline-flex;align-items:center;gap:3px;color:var(--color-text-tertiary);font-family:var(--font-family-business);font-size:var(--font-size-micro)"><x-import component-from-global-scope="OrbitaDesignSystem_994749.Icon" name="git-branch" size="{{ 11 }}" stroke-width="{{ 1.8 }}" hint-size="11px,11px"></x-import>main</span>
</span>
<span style="color:var(--color-text-tertiary);font-family:var(--font-family-business);font-size:var(--font-size-micro)">12</span>
</span>
<x-import component-from-global-scope="OrbitaDesignSystem_994749.IconButton" label="New task in this workspace" hint-size="32px,32px"><x-import component-from-global-scope="OrbitaDesignSystem_994749.Icon" name="plus" size="{{ 14 }}" hint-size="14px,14px"></x-import></x-import>
</div>
<x-import component-from-global-scope="OrbitaDesignSystem_994749.SessionRow" title="A running task" time="14:22" status="running" hint-size="100%,36px"></x-import>
<x-import component-from-global-scope="OrbitaDesignSystem_994749.SessionRow" title="A finished task" time="13:40" status="done" hint-size="100%,36px"></x-import>
</div>
<div style="display:grid;grid-template-columns:minmax(0,1fr) 32px;align-items:center;gap:2px;min-height:28px;margin-top:var(--space-3)">
<span style="font-family:var(--font-family-business);font-size:var(--font-size-micro);letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-secondary)">Tasks</span>
<x-import component-from-global-scope="OrbitaDesignSystem_994749.IconButton" label="New task" hint-size="32px,32px"><x-import component-from-global-scope="OrbitaDesignSystem_994749.Icon" name="plus" size="{{ 14 }}" hint-size="14px,14px"></x-import></x-import>
</div>
<x-import component-from-global-scope="OrbitaDesignSystem_994749.SessionRow" title="A task with no workspace" time="Aug 19" hint-size="100%,36px"></x-import>
</div>
<div style="display:flex;align-items:center;gap:var(--space-2)">
<x-import component-from-global-scope="OrbitaDesignSystem_994749.IconButton" label="Archive (planned)" disabled="{{ true }}" hint-size="32px,32px"><x-import component-from-global-scope="OrbitaDesignSystem_994749.Icon" name="archive" size="{{ 14 }}" hint-size="14px,14px"></x-import></x-import>
<span style="font-size:var(--font-size-caption);color:var(--color-text-primary)">Archived（0）</span>
</div>
<div style="display:flex;align-items:center;gap:var(--space-2)">
<span style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:26px;color:var(--color-text-secondary)"><x-import component-from-global-scope="OrbitaDesignSystem_994749.Icon" name="gauge" size="{{ 14 }}" hint-size="14px,14px"></x-import></span>
<div style="display:flex;gap:3px">
<span style="width:10px;height:10px;border-radius:2px;background:var(--color-accent)"></span>
<span style="width:10px;height:10px;border-radius:2px;background:var(--color-accent)"></span>
<span style="width:10px;height:10px;border-radius:2px;background:var(--color-accent)"></span>
<span style="width:10px;height:10px;border-radius:2px;background:var(--color-accent)"></span>
<span style="width:10px;height:10px;border-radius:2px;background:var(--color-accent)"></span>
<span style="width:10px;height:10px;border-radius:2px;background:var(--color-bg-hover)"></span>
<span style="width:10px;height:10px;border-radius:2px;background:var(--color-bg-hover)"></span>
</div>
</div>
<div style="display:flex;align-items:center;gap:var(--space-2)">
<span style="display:grid;place-items:center;width:32px;height:26px"><span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:var(--radius-pill);background:var(--color-bg-muted);color:var(--color-text-tertiary)"><x-import component-from-global-scope="OrbitaDesignSystem_994749.Icon" name="user" size="{{ 14 }}" hint-size="14px,14px"></x-import></span></span>
<span style="flex:1;font-size:var(--font-size-caption);color:var(--color-text-primary)">User Name</span>
<x-import component-from-global-scope="OrbitaDesignSystem_994749.IconButton" label="Settings" hint-size="32px,32px"><x-import component-from-global-scope="OrbitaDesignSystem_994749.Icon" name="settings" size="{{ 16 }}" hint-size="16px,16px"></x-import></x-import>
</div>
</aside>
<main style="flex:1;min-width:0;overflow:hidden;background:var(--glass-bg);border:0;border-radius:var(--radius-xl);box-shadow:var(--shadow-composer);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));display:grid;place-items:center;padding:var(--space-8) 48px">
<div style="width:min(100%, var(--content-max-width));display:flex;flex-direction:column;align-items:center;gap:var(--space-5)">
<h1 style="margin:0;font-family:var(--font-family-brand);font-size:36px;font-weight:600;letter-spacing:.04em;text-align:center">璇玑运转，诸事得序</h1>
<x-import component-from-global-scope="OrbitaDesignSystem_994749.Composer" placeholder="Ask anything, or start a task" hint-size="100%,96px"></x-import>
</div>
</main>
<aside style="flex:0 0 auto;width:32px;height:100%;display:flex;flex-direction:column;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3);background:transparent;overflow:hidden">
<x-import component-from-global-scope="OrbitaDesignSystem_994749.IconButton" label="Open files panel" variant="soft" hint-size="32px,32px"><x-import component-from-global-scope="OrbitaDesignSystem_994749.Icon" name="panel-right" size="{{ 16 }}" hint-size="16px,16px"></x-import></x-import>
<x-import component-from-global-scope="OrbitaDesignSystem_994749.IconButton" label="Copy transcript" variant="soft" hint-size="32px,32px"><x-import component-from-global-scope="OrbitaDesignSystem_994749.Icon" name="copy" size="{{ 16 }}" hint-size="16px,16px"></x-import></x-import>
<x-import component-from-global-scope="OrbitaDesignSystem_994749.IconButton" label="Terminal" variant="soft" hint-size="32px,32px"><x-import component-from-global-scope="OrbitaDesignSystem_994749.Icon" name="terminal" size="{{ 16 }}" hint-size="16px,16px"></x-import></x-import>
</aside>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;\&quot;light\&quot; | \&quot;dark\&quot;&quot;}}">
class Component extends DCLogic {
  syncTheme() {
    document.documentElement.dataset.theme = this.props.theme || "light";
  }
  componentDidMount() { this.syncTheme(); }
  componentDidUpdate() { this.syncTheme(); }
  renderVals() {
    return {};
  }
}

</script>
</body>
</html>
