<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:18px;background:radial-gradient(900px 500px at 20% 6%,#fff 0%,rgba(255,255,255,0) 58%),linear-gradient(140deg,#e8ebe4 0%,#f3f4f1 42%,#eae7dd 100%);font-family:var(--font-family-base);color:var(--color-text-primary)}#root{display:flex;flex-direction:column;gap:14px}.lbl{font-size:var(--font-size-micro);color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.06em}@keyframes orbita-skeleton{0%,100%{opacity:1}50%{opacity:.45}}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.ORBITA_ICON_BASE="../../assets/icons/lucide";</script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { GlassCard, SessionCard, Chip, Icon } = window.OrbitaDesignSystem_994749;
function Demo(){return (<>
  <GlassCard layer={1} padding="14px" style={{display:"flex",flexDirection:"column",gap:10}}>
    <span className="lbl">layer 1 · app boundary</span>
    <GlassCard layer={2} padding="14px" style={{display:"flex",flexDirection:"column",gap:10}}>
      <span className="lbl">layer 2 · chat surface</span>
      <div style={{display:"flex",gap:12}}>
        <SessionCard name="orbita-desktop" queries={["Refactor the composer bar","Unify the glass alphas","Collapse tool output"]} running />
        <SessionCard name="renderer" queries={["Read styles.css","Split the sidebar"]} />
        <SessionCard name="notes" loading />
      </div>
      <GlassCard layer={3} padding="8px 10px" style={{display:"flex",gap:8,alignItems:"center"}}>
        <span className="lbl" style={{flex:1}}>layer 3 · input box</span>
        <Chip icon={<Icon name="folder" size={12} />} chevron>Current project</Chip>
        <Chip icon={<Icon name="shield-check" size={12} />} chevron>Full access</Chip>
        <Chip chevron active>GLM-5.3</Chip>
        <Chip icon={<Icon name="gauge" size={12} />} chevron>Max</Chip>
      </GlassCard>
    </GlassCard>
  </GlassCard>
</>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script></body></html>
